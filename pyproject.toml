[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "0.1.0"
description = "Xエージェント: テキスト→AI整形→承認→自動分散投稿/エンゲージ + 管理UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",            # [standard]は付けない: 3.14でuvloop/httptoolsのビルドを避けるため
    "watchfiles>=0.21",         # launchd常駐の uvicorn --reload 用(コード保存で自動反映)。3.14向けwheel有
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "tweepy>=4.14",
    "APScheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # 画像アップロード(将来)用
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]  # Claude Code連携(副)。`pip install -e ".[mcp]"` で導入

[project.scripts]
xagent = "xagent.cli:main"
xagent-mcp = "xagent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["xagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
